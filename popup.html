<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quick Settings</title>
  <style>
    body { width: 280px; font-family: Arial, sans-serif; padding: 10px; margin: 0; background: #f9f9f9; }
    h4 { margin: 0 0 6px 0; color: #333; font-size: 12px; }
    label { font-size: 10px; font-weight: bold; color: #555; display: block; margin-top: 4px; }
    input { width: 100%; padding: 5px; margin-top: 2px; box-sizing: border-box; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 8px; background: #0073b1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; font-size: 11px; }
    button:hover { background: #005582; }
    #scanStatus { font-size: 11px; color: #0f766e; min-height: 36px; margin: 8px 0 0; line-height: 1.4; }
  </style>
</head>
<body>
  <h4>Quick Config</h4>
  <label>Resume (PDF/DOCX):</label>
  <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
  
  <label>Target Keywords:</label>
  <input type="text" id="keywords" placeholder="php, laravel, full stack">

  <div style="display: flex; gap: 4px;">
    <div><label>Exp (±2 yrs):</label><input type="text" id="totalExp" placeholder="5"></div>
    <div><label>Notice:</label><input type="text" id="noticePeriod" placeholder="30"></div>
  </div>
  
  <button id="saveConfig">Save Settings</button>
  <p id="scanStatus">Opening the extension starts the scan. The dashboard opens after the list is ready.</p>

  <script src="popup.js"></script>
</body>
</html>
